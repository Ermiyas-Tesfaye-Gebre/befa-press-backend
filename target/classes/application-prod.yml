# ================================================
# BEFA Press - Production Configuration
# ================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.befapress: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Disable Swagger in production
springdoc:
  swagger-ui:
    enabled: false
