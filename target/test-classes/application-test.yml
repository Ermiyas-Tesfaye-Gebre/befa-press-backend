# Test Profile Configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true

  mail:
    host: localhost
    port: 25
    username: test
    password: test

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1taW4tMjU2LWJpdHM=
  expiration: 3600000
  refresh-expiration: 86400000

otp:
  expiration: 600000
  length: 6

app:
  name: BEFA Press Test
  base-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    com.befapress: DEBUG
