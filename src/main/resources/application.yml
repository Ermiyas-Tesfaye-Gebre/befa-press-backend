# ================================================
# BEFA Press - Application Configuration
# ================================================

spring:
  application:
    name: befa-press

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/befa_press?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ermi12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        connection.characterEncoding: utf8
        connection.charSet: utf8
        connection.useUnicode: true

  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ermitesfayegebre@gmail.com}
    password: ${MAIL_PASSWORD:dzdwajlzvrydjcqt}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 9090
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:5r4E2qT4h5y6w7u8i9o0p1q2s3t4u5v6w7x8y9z0a1b=}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# OTP Configuration
otp:
  expiry-minutes: 5
  length: 6

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  upload:
    path: ${UPLOAD_PATH:./uploads}
  base-url: ${BASE_URL:http://localhost:9090}

# Logging Configuration
logging:
  level:
    com.befapress: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.befapress.controller
  paths-to-match: /api/**
