# ================================================
# BEFA Press - Application Configuration
# ================================================

spring:
  application:
    name: befa-press

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/befa_press?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ermi12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:befapress@gmail.com}
    password: ${MAIL_PASSWORD:qecahzpmazuzzudk}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 9090
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:5r4E2qT4h5y6w7u8i9o0p1q2s3t4u5v6w7x8y9z0a1b=}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# OTP Configuration
otp:
  expiry-minutes: 5
  length: 6

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:19006
  upload:
    path: ${UPLOAD_PATH:./uploads}
  base-url: ${BASE_URL:http://localhost:9090}

# Logging Configuration
logging:
  level:
    com.befapress: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Telebirr Payment Configuration
telebirr:
  fabric-app-id: ${TELEBIRR_APP_ID:1572189077811204}
  app-secret: ${TELEBIRR_APP_SECRET:914978}
  merchant-app-id: ${TELEBIRR_MERCHANT_APP_ID:fad0f06383c6297f545876694b974599}
  merchant-code: ${TELEBIRR_MERCHANT_CODE:c4182ef8-9249-458a-985e-06d191f4d505}
  private-key: ${TELEBIRR_PRIVATE_KEY:}
  base-url: ${TELEBIRR_BASE_URL:https://developerportal.ethiotelebirr.et:38443/apiaccess/payment/gateway}
